<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotation Builder — Demo</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;min-height:100vh;font-family:system-ui,sans-serif;background:#f8f9fb;color:#111;overflow:auto}
    .page-header{background:#fff;border-bottom:1px solid #eee;padding:28px 40px}
    .page-header h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin-bottom:4px}
    .page-header p{color:#aaa;font-size:13px}
    .demo-controls{background:#fff;border-bottom:1px solid #eee;padding:16px 40px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .demo-controls label{font-size:13px;font-weight:500;color:#555}
    .demo-controls select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#111;cursor:pointer;min-width:200px}
    .demo-controls select:focus{outline:2px solid #1a3a5c;outline-offset:1px}
    .demo-controls .hint{font-size:12px;color:#aaa}
    .content{padding:40px 32px 80px;max-width:760px;margin:0 auto}
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Quotation Builder</h1>
    <p>Interactive quote configurator for services</p>
  </div>
  <div class="demo-controls">
    <label for="demo-preset">Profession preset</label>
    <select id="demo-preset" disabled></select>
    <label for="demo-font">Font</label>
    <select id="demo-font"></select>
    <label for="demo-ui">Interface</label>
    <select id="demo-ui"></select>
    <label for="demo-btn">Buttons</label>
    <select id="demo-btn"></select>
    <span class="hint">Everything here is a script-tag parameter the store writes.</span>
  </div>
  <div class="content">
    <div id="anavo-quotation"></div>
  </div>
  <script>
  (function(){
    var p = new URLSearchParams(location.search);
    var CDN = 'https://cdn.jsdelivr.net/gh/clonegarden/squarespaceplugins@latest/quotation-builder/';
    var DEFAULT_PRESET = 'photographer';

    // Appearance options, mirroring FONT_STACKS / UI_STYLES / BUTTON_RADII.
    // These are short closed lists, so a copy here costs less than another
    // fetch; the preset list is the one that kept drifting, and it is now
    // read from the file the plugin itself is generated against.
    var THEME = {
      font:        ['inherit', 'system', 'sans', 'serif', 'rounded', 'mono'],
      uiStyle:     ['card', 'flat', 'bold', 'minimal'],
      buttonStyle: ['rounded', 'pill', 'square', 'outline']
    };

    function fill(sel, entries, active) {
      entries.forEach(function(entry){
        var o = document.createElement('option');
        o.value = entry[0];
        o.textContent = entry[1];
        sel.appendChild(o);
      });
      sel.value = active;
    }

    function reloadWith(key, value) {
      var next = new URL(location.href);
      next.searchParams.set(key, value);
      location.assign(next.toString());
    }

    [['demo-font', 'font'], ['demo-ui', 'uiStyle'], ['demo-btn', 'buttonStyle']].forEach(function(pair){
      var sel = document.getElementById(pair[0]);
      var names = THEME[pair[1]];
      var active = names.indexOf(p.get(pair[1])) > -1 ? p.get(pair[1]) : names[0];
      fill(sel, names.map(function(n){ return [n, n.charAt(0).toUpperCase() + n.slice(1)]; }), active);
      sel.addEventListener('change', function(){ reloadWith(pair[1], sel.value); });
    });

    // presets.json is generated from the plugin source by
    // scripts/export-presets.js, so this list cannot drift out of sync the
    // way the hardcoded mirror it replaces did.
    var presetSel = document.getElementById('demo-preset');

    function boot(entries) {
      var requested = p.get('preset') || '';
      var known = entries.some(function(e){ return e[0] === requested; });
      var active = known ? requested : DEFAULT_PRESET;

      fill(presetSel, entries, active);
      presetSel.disabled = false;
      // The plugin guards against double-init via AnavoPluginState, so
      // swapping presets needs a fresh document, not a re-injected tag.
      presetSel.addEventListener('change', function(){ reloadWith('preset', presetSel.value); });

      var u = new URL(CDN + 'quotation-builder.min.js');
      u.searchParams.set('domain', 'anavo.tech');
      p.forEach(function(val, key){ u.searchParams.set(key, val); });
      // After the passthrough, so the select and the widget always agree.
      u.searchParams.set('preset', active);
      var s = document.createElement('script');
      s.src = u.toString();
      document.body.appendChild(s);
    }

    fetch(CDN + 'presets.json')
      .then(function(r){ return r.json(); })
      .then(function(d){
        boot((d.presets || []).map(function(x){ return [x.id, x.label]; }));
      })
      .catch(function(){
        // The widget matters more than the picker: render the default rather
        // than leaving the page blank because a JSON file failed to load.
        boot([[DEFAULT_PRESET, 'Photographer']]);
      });
  })();
  </script>
</body>
</html>
